# docker-compose de Enlace Sonoro (Guía 8): API + base de datos PostgreSQL
#
#   docker compose up --build -d     -> levanta todo; la API queda en http://localhost:8000/docs
#   docker compose ps                -> estado y health checks ("healthy")
#   docker compose logs -f api       -> ver los logs de la API
#   docker compose down              -> apaga todo (los datos quedan en el volumen pgdata)
#
# Las claves se leen del archivo .env (NO se sube a GitHub). Ver .env.example.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: enlace_sonoro
      POSTGRES_USER: enlace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data   # los datos sobreviven a docker compose down
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enlace -d enlace_sonoro"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Sin "ports": la base de datos solo es visible dentro de la red de compose (no desde Internet)

  api:
    build: .
    image: enlace-sonoro-api:local
    env_file: .env   # GEMINI_API_KEY, JWT_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD, POSTGRES_PASSWORD...
    environment:
      DATABASE_URL: postgresql://enlace:${POSTGRES_PASSWORD}@db:5432/enlace_sonoro
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # la API arranca solo cuando PostgreSQL ya acepta conexiones
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
