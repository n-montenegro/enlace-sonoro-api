# Configuración de herramientas del proyecto

[tool.mutmut]
# Mutation testing: se muta la lógica de negocio (dominio y casos de uso)
paths_to_mutate = ["app/domain/", "app/application/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["app/", "scripts/", ".github/", "requirements-lock.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["mutants", "venv", ".git"]
