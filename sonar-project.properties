# Configuración de SonarQube Cloud
# IMPORTANTE: projectKey y organization deben coincidir con los que muestra sonarcloud.io
sonar.projectKey=n-montenegro_enlace-sonoro-api
sonar.organization=n-montenegro
sonar.projectName=Enlace Sonoro API

# sonar.sources y sonar.tests ya no se usan: SonarQube Cloud analiza todo el proyecto
# y detecta solo cuáles archivos son pruebas (advertencia del análisis).
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
